name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Protocol, privacy, and skill structure
        working-directory: plugins/bio-research-forge
        run: npm test
      - name: Public API smoke tests
        working-directory: plugins/bio-research-forge
        run: npm run test:live
